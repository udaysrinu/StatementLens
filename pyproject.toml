[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statementlens"
version = "0.2.0"
description = "Local-first personal-finance engine: read bank/card statements from email, categorize, and render CRED-style analytics — fully offline, deterministic money math."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "StatementLens contributors"}]
keywords = ["personal-finance", "pfm", "bank-statement", "pdf", "analytics", "dashboard",
    "account-aggregator", "cred-money", "expense-tracking", "gmail", "offline", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = ["pikepdf>=8.0.0", "pdfplumber>=0.10.0"]

[project.optional-dependencies]
gmail = ["google-api-python-client>=2.0.0", "google-auth-oauthlib>=1.0.0", "google-auth-httplib2>=0.2.0"]
pdf = []   # now a core dependency; kept so `[pdf]` stays valid for existing installs
ocr = ["pytesseract>=0.3.10", "pillow>=10.0.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=4.1.0"]
all = ["google-api-python-client>=2.0.0", "google-auth-oauthlib>=1.0.0", "google-auth-httplib2>=0.2.0",
    "pikepdf>=8.0.0", "pdfplumber>=0.10.0", "pytesseract>=0.3.10", "pillow>=10.0.0"]

[project.urls]
Homepage = "https://github.com/udaysrinu/statementlens"
Repository = "https://github.com/udaysrinu/statementlens"
Issues = "https://github.com/udaysrinu/statementlens/issues"

[project.scripts]
statementlens = "statementlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
statementlens = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
